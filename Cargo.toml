[package]
name = "gftools"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.12.15", features = ["blocking", "json"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
skrifa = "0.30.0"
thiserror = "2.0.12"
protobuf = "3.7.1"
scraper = "0.23.1"
chrono = { version = "0.4.40", features = ["serde"] }
log = "0.4.27"
toml = "0.8.20"
serde_json_path_to_error = "0.1.4"

[build-dependencies]
protobuf-codegen = "3.7.1"

[dev-dependencies]
expanduser = "1.2.2"
env_logger = "0.11.8"
